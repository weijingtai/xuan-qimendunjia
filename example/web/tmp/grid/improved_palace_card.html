<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改进版奇门宫位卡片</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .palace-card {
    background-color: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    width: 220px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    transition: all 0.3s ease;
  }
  .palace-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
  }
  .layer {
    font-size: 28px;
    letter-spacing: 1.5px;
  }
  .star {
    color: #9013FE; /* 紫菀 - 金 (沿用) */
  }
  .door {
    color: #D0021B; /* 朱磦 - 惊门属金，但用红色以示警示 */
    font-size: 24px;
  }
  .god {
    background-color: rgba(212, 165, 116, 0.15); /* 琥珀黄-柔和背景 */
    color: #D4A574; /* 琥珀黄 */
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 18px;
  }
  .stems {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }
  .stem-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stem {
    background-color: #f5f7fa;
    color: #495057;
    width: 36px;
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    font-size: 20px;
    border: 1px solid #dee2e6;
  }
  .status {
    font-size: 11px;
    font-weight: 400;
    color: #868e96;
    background-color: #f8f9fa;
    border: 1px solid #e9ecef;
    padding: 2px 5px;
    border-radius: 6px;
  }
  .earth-stem {
    font-size: 18px;
    color: #adb5bd;
    margin-top: 4px;
  }
  .pattern-badge {
    background-color: rgba(74, 124, 89, 0.1); /* 松石绿 - 吉 */
    color: #4A7C59;
    padding: 6px 16px;
    border-radius: 18px;
    font-size: 15px;
    margin-top: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="palace-card">
  <div class="layer star">天柱</div>
  <div class="layer door">惊门</div>
  <div class="layer god">太阴</div>
  <div class="stems">
    <div class="stem-group">
      <span class="stem">庚</span>
      <span class="status">帝旺</span>
    </div>
    <div class="stem-group">
      <span class="stem">丙</span>
      <span class="status">长生</span>
    </div>
  </div>
  <div class="earth-stem">酉</div>
  <div class="pattern-badge">飞鸟跌穴</div>
</div>

</body>
</html>
