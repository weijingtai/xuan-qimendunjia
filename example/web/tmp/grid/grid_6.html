<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>玄机奇门 - 流派自适应排盘系统</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --palace-bg: #161618;
            --border: #2c2c2e;
            --primary: #e4e4e6;
            --secondary: #8e8e93;
            /* 能量色 */
            --green: #32d74b; --red: #ff453a; --blue: #0a84ff; --gold: #ffd60a;
        }

        body { background: var(--bg); color: var(--primary); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* 顶部全局概览层 (文档 6.2) */
        .meta-header { width: 400px; display: flex; justify-content: space-between; font-size: 13px; color: var(--secondary); margin-bottom: 15px; border: 1px solid var(--border); padding: 10px; border-radius: 8px; }

        /* 九宫容器 */
        .qimen-grid { display: grid; grid-template-columns: repeat(3, 130px); grid-template-rows: repeat(3, 160px); gap: 5px; background: var(--border); padding: 5px; border-radius: 4px; }

        /* 宫位容器 */
        .palace { background: var(--palace-bg); position: relative; padding: 8px; display: flex; flex-direction: column; cursor: pointer; transition: all 0.2s; }
        .palace:hover { background: #1c1c1e; outline: 1px solid var(--blue); }
        
        /* 空亡状态处理 */
        .palace.is-empty { background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.02) 5px, rgba(255,255,255,0.02) 10px); border: 1px dashed #444; }

        /* 1. 时空背景层 (第二梯队) */
        .background-layer { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
        .god.is-luck { color: var(--green); }
        .god.is-bad { color: var(--red); }
        .horse-badge { background: var(--blue); color: #fff; padding: 0 3px; border-radius: 2px; }

        /* 2. 核心枢纽层 (第一梯队) */
        .core-layer { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .gate-box { display: flex; flex-direction: column; align-items: center; }
        .gate { font-size: 20px; font-weight: bold; writing-mode: vertical-rl; }
        .gate.forced { text-decoration: underline wavy var(--red); } /* 门迫标识 */
        .energy-tag { font-size: 9px; margin-top: 2px; color: var(--secondary); }

        .stems { display: flex; flex-direction: column; align-items: flex-end; }
        .stem-t { font-size: 28px; font-weight: 800; line-height: 1; }
        .stem-d { font-size: 18px; color: var(--secondary); margin-top: 4px; }

        /* 3. 深层推演层 (第四梯队) */
        .deep-layer { margin-top: 5px; border-top: 1px solid #252525; padding-top: 4px; display: flex; flex-direction: column; gap: 3px; }
        .hidden-info { font-size: 10px; color: #555; display: flex; justify-content: space-between; }
        .pattern-badge { font-size: 10px; text-align: center; padding: 2px; border-radius: 2px; background: rgba(255,214,10,0.1); color: var(--gold); border: 1px solid rgba(255,214,10,0.2); }
        .pattern-badge.is-bad { background: rgba(255,69,58,0.1); color: var(--red); border-color: rgba(255,69,58,0.2); }

        /* 流派指示器 */
        .school-tag { position: absolute; top: -10px; right: 0; font-size: 10px; color: var(--gold); }
    </style>
</head>
<body>

    <div class="meta-header">
        <div>丙午月 戊申日 <b>转盘·阳五局</b></div>
        <div>值符：天芮 值使：死门</div>
    </div>

    <div class="qimen-grid">
        <div class="palace is-empty">
            <div class="background-layer">
                <span class="god is-luck">值符</span>
                <span class="star">天芮</span>
                <span class="horse-badge">马</span>
            </div>

            <div class="core-layer">
                <div class="gate-box">
                    <span class="gate forced" style="color:var(--red)">死门</span>
                    <span class="energy-tag">旺(100%)</span>
                </div>
                <div class="stems">
                    <span class="stem-t" style="color:var(--green)">戊</span>
                    <span class="stem-d">丙</span>
                </div>
            </div>

            <div class="deep-layer">
                <div class="hidden-info">
                    <span>暗壬</span>
                    <span>病(衰)</span>
                </div>
                <div class="pattern-badge">青龙返首</div>
            </div>
        </div>

        <div class="palace">
            <div class="background-layer"><span class="god">九天</span><span class="star">天英</span></div>
            <div class="core-layer">
                <div class="gate-box"><span class="gate">景门</span><span class="energy-tag">相(80%)</span></div>
                <div class="stems"><span class="stem-t">癸</span><span class="stem-d">乙</span></div>
            </div>
            <div class="deep-layer">
                <div class="hidden-info"><span>暗乙</span><span>临官</span></div>
                <div class="pattern-badge is-bad">朱雀入狱</div>
            </div>
        </div>

        </div>

</body>
</html>
