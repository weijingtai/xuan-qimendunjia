<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇门遁甲·金石交互盘面</title>
    <style>
        :root {
            --bg-paper: #fdfcf0; /* 仿古宣纸色 */
            --ink-black: #1a1a1a; /* 墨色 */
            --cinnabar: #a61b29; /* 辰砂红 */
            --gold: #b8860b;    /* 暗金色 */
            --stone-blue: #2d5d7b; /* 石青 */
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Microsoft YaHei", "SimSun", serif;
        }

        /* 手机容器模拟 */
        .app-container {
            width: 390px;
            height: 844px;
            background-color: var(--bg-paper);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            border: 8px solid #333;
        }

        /* 顶部匾额 */
        .header-plaque {
            background-color: #3d4a3d; /* 深绿石色 */
            border: 2px solid var(--gold);
            border-radius: 10px;
            height: 50px;
            margin: 40px auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .header-plaque h1 {
            color: var(--gold);
            margin: 0;
            font-size: 20px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        /* 九宫格布局 */
        .qimen-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: rgba(184, 134, 11, 0.3); /* 细金分割线 */
            border: 2px solid var(--gold);
            aspect-ratio: 1 / 1;
        }

        /* 单个宫位 */
        .palace {
            background-color: var(--bg-paper);
            position: relative;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. 八门 (核心中心位) */
        .eight-gate {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: var(--ink-black);
            z-index: 2;
        }

        /* 2. 十干克应 (右侧骨架) */
        .stems-container {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }
        .stem-heaven { font-size: 20px; color: var(--stone-blue); }
        .stem-earth { font-size: 20px; color: #666; }

        /* 3. 九星与八神 (左侧背景) */
        .star-god-container {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }
        .star { color: #555; }
        .god { color: var(--gold); font-weight: bold; }

        /* 4. 旬空 (右上角印章) */
        .void-seal {
            position: absolute;
            right: 4px;
            top: 4px;
            border: 1px solid var(--cinnabar);
            color: var(--cinnabar);
            font-size: 10px;
            padding: 1px;
            transform: rotate(15deg);
            opacity: 0.8;
        }

        /* 5. 格局标签 (底部红印) */
        .pattern-seal {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background-color: var(--cinnabar);
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: serif;
        }

        /* 底部信息栏 */
        .footer-info {
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }
        .time-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        /* 交互反馈 */
        .palace:active {
            background-color: #f0ede0;
        }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header-plaque">
        <h1>三奇升殿吉</h1>
    </div>

    <div class="qimen-grid">
        <div class="palace" style="border-right: 1px solid #eee; border-bottom: 1px solid #eee;">
            <div class="star-god-container">
                <div class="god">螣蛇</div>
                <div class="star">天辅</div>
            </div>
            <div class="void-seal">空</div>
            <div class="eight-gate">杜門</div>
            <div class="stems-container">
                <span class="stem-heaven">丙</span>
                <span class="stem-earth">辛</span>
            </div>
            <div class="pattern-seal">刑杀</div>
        </div>

        <div class="palace">
            <div class="star-god-container">
                <div class="god">值符</div>
                <div class="star">天芮</div>
            </div>
            <div class="eight-gate">景門</div>
            <div class="stems-container">
                <span class="stem-heaven">癸</span>
                <span class="stem-earth">乙</span>
            </div>
        </div>

        <div class="palace">
            <div class="star-god-container">
                <div class="god">九天</div>
                <div class="star">天禽</div>
            </div>
            <div class="eight-gate" style="color:var(--cinnabar)">死門</div>
            <div class="stems-container">
                <span class="stem-heaven">戊</span>
                <span class="stem-earth">己</span>
            </div>
            <div class="pattern-seal">青龙</div>
        </div>

        <div class="palace"><div class="eight-gate">驚門</div></div>
        <div class="palace" style="background: #fdfcf0 url('https://www.transparenttextures.com/patterns/natural-paper.png');">
            <div style="text-align:center; margin-top:35%; color:var(--gold); font-size:20px;">中宫</div>
        </div>
        <div class="palace"><div class="eight-gate">開門</div></div>

        <div class="palace"><div class="eight-gate">休門</div></div>
        <div class="palace"><div class="eight-gate">生門</div></div>
        <div class="palace">
            <div class="eight-gate">傷門</div>
            <div class="pattern-seal" style="background: var(--stone-blue);">玉女</div>
        </div>
    </div>

    <div class="footer-info">
        <div class="time-item">
            <span>丙午年 庚寅月 戊申日 辛酉时</span>
        </div>
        <div class="time-item">
            <span>阳遁八局 · 值符天芮 · 值使死门</span>
        </div>
        <div style="margin-top:20px; color: var(--gold); text-align: center; border: 1px solid var(--gold); padding: 10px;">
            点击宫位查看详情分析
        </div>
    </div>
</div>

</body>
</html>
