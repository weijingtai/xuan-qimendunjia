name: example
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  qimendunjia:
    git:
      url: http://xuan:***@192.168.0.165:3000/xuan/xuan-qimendunjia.git
      ref: main
  provider: ^6.1.1
  logging: ^1.2.0
  timezone: ^0.9.4

  lottie: ^3.3.2
  cupertino_icons: ^1.0.8
  persistence_drift:
    path: ../../xuan-storage/drift
  persistence_preferences:
    path: ../../xuan-storage/preferences
  shared_preferences: ^2.2.0
  drift: ^2.30.1

dependency_overrides:
  google_fonts: ^6.2.1
  xuan_four_zhu_card:
    path: ../../xuan-four-zhu-card
  qimendunjia:
    path: ../
  # Mirror the overrides from qimendunjia's own pubspec so transitive
  # path deps resolve correctly from the example/ directory.
  persistence_core:
    path: ../../xuan-storage/core
  persistence_drift:
    path: ../../xuan-storage/drift
  persistence_preferences:
    path: ../../xuan-storage/preferences
  metaphysics_core:
    path: ../../xuan-metaphysics-core
  xuan_gua_core:
    path: ../../xuan-gua-core
  persistence_domain:
    path: ../../xuan-domain
  xuan_time_location:
    path: ../../xuan-time-location
  repository_interface_qimendunjia:
    path: ../../repository-interface-qimendunjia
  repository_interface_four_zhu_card:
    path: ../../repository-interface-four-zhu-card
  theme:
    path: ../../theme
  divination_case:
    path: ../../xuan-divination-case

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/qi_men_dun_jia/
    - assets/lotties/
    - assets/backgrounds/
    - assets/dataset/
